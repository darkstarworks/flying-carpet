plugins {
    // Non-remapping Loom for the unobfuscated 26.x line.
    id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT'
    id 'com.modrinth.minotaur' version '2.10.0'
}

base {
    archivesName = "${project.archives_base_name}-fabric"
}

repositories {
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/releases'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    // Optional: only used to add a settings button to Mod Menu's mod list.
    compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

modrinth {
    token = providers.environmentVariable('MODRINTH_TOKEN')
    projectId = project.modrinth_project
    versionNumber = "${project.mod_version}+fabric"
    versionName = "Flying Carpet ${project.mod_version} (Fabric)"
    versionType = 'release'
    uploadFile = tasks.jar
    gameVersions = [project.minecraft_version]
    loaders = ['fabric']
    changelog = rootProject.file('CHANGELOG.md').text
    syncBodyFrom = rootProject.file('README.md').text
    dependencies {
        required.project 'fabric-api'
        optional.project 'modmenu'
    }
}
