// Root project: no loader plugin here. Each loader module applies its own build
// plugin and compiles the shared code and resources from common/.
//
// common/ is a plain shared-source folder (not a Gradle module), so the
// loader-agnostic code is compiled once per loader against that loader's Minecraft.

allprojects {
    group = project.maven_group
    version = project.mod_version
}

subprojects {
    apply plugin: 'java'

    java {
        toolchain.languageVersion = JavaLanguageVersion.of(25)
        withSourcesJar()
    }

    sourceSets {
        main {
            java.srcDir rootProject.file('common/src/main/java')
            resources.srcDir rootProject.file('common/src/main/resources')
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.release = 25
        options.encoding = 'UTF-8'
        options.compilerArgs << '-Xlint:deprecation'
    }
}

// The newest `## [` section of CHANGELOG.md, used as the Modrinth changelog.
ext.latestChangelog = {
    def text = rootProject.file('CHANGELOG.md').text
    def sections = text.split(/(?m)^(?=## \[)/).findAll { it.startsWith('## [') }
    return sections ? sections[0].readLines().drop(1).join('\n').trim() : ''
}
