# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Fabric
minecraft_version=26.3
loader_version=0.19.5
fabric_version=0.161.0+26.3
modmenu_version=21.0.0

# JEI (optional, compile-only): shows the carpet recipes in its recipe viewer
jei_version=31.17.0.109

# NeoForge
neoforge_version=26.3.0.26-beta

# NOTE: Minecraft is unobfuscated from 26.1 onward. There are NO Yarn mappings.
# Loom uses Mojang's official mappings (loom.officialMojangMappings()).

# Mod Properties
mod_version=0.2.1
maven_group=com.darkstarworks.flyingcarpet
archives_base_name=flying-carpet

# Modrinth: the project's slug or ID. Publishing reads the token from the
# MODRINTH_TOKEN environment variable.
modrinth_project=flying-carpet
